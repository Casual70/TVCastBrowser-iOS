name: TVCastBrowser
options:
  bundleIdPrefix: com.tvcast
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "15.0"

targets:
  TVCastBrowser:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: TVCastBrowser
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tvcast.browser.ios
        INFOPLIST_FILE: TVCastBrowser/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""