name: Build iOS IPA & Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build Unsigned iOS .ipa (Sideloadly / AltStore)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Xcode Project with XcodeGen
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build iOS App (Release, Unsigned)
        working-directory: ios
        run: |
          xcodebuild clean build \
            -project TVCastBrowser.xcodeproj \
            -scheme TVCastBrowser \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package .app into TVCastBrowser-iOS.ipa
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/TVCastBrowser.app Payload/
          zip -r9 TVCastBrowser-iOS.ipa Payload

      - name: Upload iOS .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TVCastBrowser-iOS-IPA
          path: ios/TVCastBrowser-iOS.ipa
          retention-days: 30

