name: Build iOS IPA & Android FOSS Release APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Signed FOSS Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Build Signed Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          cp app/build/outputs/apk/release/*.apk TVCastBrowser-v1.6.0.apk

      - name: Upload Android Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TVCastBrowser-Android-FOSS-APK
          path: TVCastBrowser-v1.6.0.apk
          retention-days: 30

  build-ios:
    name: Build Unsigned iOS .ipa (Sideloadly / AltStore)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Xcode Project with XcodeGen
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build iOS App (Release, Unsigned)
        working-directory: ios
        run: |
          xcodebuild clean build \
            -project TVCastBrowser.xcodeproj \
            -scheme TVCastBrowser \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package .app into TVCastBrowser-iOS.ipa
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/TVCastBrowser.app Payload/
          zip -r9 TVCastBrowser-iOS.ipa Payload

      - name: Upload iOS .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TVCastBrowser-iOS-IPA
          path: ios/TVCastBrowser-iOS.ipa
          retention-days: 30

  publish-release:
    name: Publish GitHub Release
    needs: [ build-android, build-ios ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: TVCastBrowser-Android-FOSS-APK

      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: TVCastBrowser-iOS-IPA

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            TVCastBrowser-v1.6.0.apk
            TVCastBrowser-iOS.ipa
          generate_release_notes: true
